ext.checker = new CheckNuoDBDatabaseAndVersion();
checker.check();

println("  Checking test database is available")
checker.checkDatabase('gradle/databases.gradle');

// Save these away
ext.nuodbJdbcJarVersion = checker.nuodbJdbcJarVersion;
