		classpath 'gradle.plugin.com.github.lburgazzoli:gradle-karaf-plugin:0.5.1'
		classpath 'org.asciidoctor:asciidoctor-gradle-jvm:3.3.2'
		classpath 'de.thetaphi:forbiddenapis:3.0.1'

