# This file is used by the tests copied from 'hibernate-orm/hibernate-core'.
# It also provides defaults for all the other tests.
# Connection properties are derived from the selected database properties file.

# Tests copied from hibernate_orm use the now deprecated Dailect.getDialect() to
# get a Dialect instance. This requires this property to be set and does not
# try to use the resolver. Unfortunately this uses the default constructor so
# the instance does not know the version of the underlying database. Using
# TestNuoDBDialect because it always does, but still has a default constructor.
hibernate.dialect com.nuodb.hibernate.NuoDBDialect

hibernate.connection.driver_class com.nuodb.hibernate.NuoHibernateDriver
hibernate.connection.url jdbc:com.nuodb.hib://localhost/hibernate_orm_test?slf4jLogger=true&isolation=read_committed&lock-wait-timeout=60
hibernate.connection.username hibernate_orm_test
hibernate.connection.password hibernate_orm_test

javax.persistence.jdbc.driver com.nuodb.hibernate.NuoHibernateDriver
javax.persistence.jdbc.url jdbc:com.nuodb.hib://localhost/hibernate_orm_test?slf4jLogger=true&isolation=read_committed&lock-wait-timeout=60
javax.persistence.jdbc.user hibernate_orm_test
javax.persistence.jdbc.password hibernate_orm_test

#hibernate.connection.pool_size=5

hibernate.default_schema=DBO

# Don't show SQL, we are using logging to display it instead
hibernate.show_sql false
hibernate.format_sql true

# Can't show comments, it upsets some of the tests that check the generated SQL.
hibernate.use_sql_comments=false
hibernate.max_fetch_depth=5

hibernate.cache.region_prefix=hibernate.test
hibernate.cache.region.factory_class=org.hibernate.testing.cache.CachingRegionFactory

javax.persistence.validation.mode=NONE
hibernate.service.allow_crawling=false
hibernate.session.events.log=true

#hibernate.jdbc.time_zone=UTC

hibernate.hql.bulk_id_strategy.global_temporary.drop_tables=true

# Reduce lock time out to 30s from 30 mins
# ... Not convinced this does anything useful
hibernate.pooling.idleTimeout=30

# Default lock and query timeouts, both in millis - default is -1 (wait forever).
#javax.persistence.lock.timeout=5000
#javax.persistence.query.timeout=5000

# DIALECT RESOLUTION ...

# Enable use of NuoDB Dialect resolver
hibernate.dialect_resolvers=com.nuodb.hibernate.NuoDbDialectResolver
hibernate.temp.use_jdbc_metadata_defaults=true

# ... OR ...

# Disable use of JDBC database metadata
#hibernate.boot.allow_jdbc_metadata_access=false

# Must explicitly specify database and version instead
#javax.persistence.database-product-name=NuoDB
#javax.persistence.database-major-version=5
#javax.persistence.database-minor-version=0
